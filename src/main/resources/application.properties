spring.application.name=assetpulse
server.port=8080

# ---- Database (override with environment variables) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/assetpulse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT (secret must be at least 32 characters) ----
app.jwt.secret=${JWT_SECRET:change-this-secret-key-before-production-use-12345}
app.jwt.expiration-ms=86400000

# ---- CORS (frontend origins, comma separated) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173}

# ---- Alerts & analytics ----
app.alerts.days-before-expiry=30
app.alerts.cron=0 0 8 * * *
app.analytics.idle-days=30

# ---- Email notifications (optional) ----
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@assetpulse.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Seed data (first run only) ----
app.seed.admin-email=${ADMIN_EMAIL:admin@assetpulse.com}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}
app.seed.demo-data=${SEED_DEMO_DATA:true}
